# Action → outcome grid for volley-scout (v2.3)
# Flow-aware own-side scouting. See docs/scouting-flow.md
# Setter quality is DERIVED from pass (reception/dig) + attack outcomes — not graded on second_touch in/out.

version: "2.3"
schema: action_outcome_grid

actions:
  - id: serve
    label: Serve
    outcomes:
      - id: ace
        label: Ace
      - id: in_play_in_system
        label: In play — in system
        note: Serve in; receiving team stays in system (easier). Next own touch dig/block
      - id: in_play_out_of_system
        label: In play — out of system
        note: Serve in; receiving team out of system (pressure). Next own touch dig/block
      - id: serve_error
        label: Serve error

  - id: reception
    label: Reception
    note: Only after opponent serve
    outcomes:
      - id: in_system
        label: In system
      - id: out_of_system
        label: Out of system
      - id: overpass
        label: Overpass
      - id: error
        label: Error

  - id: dig
    label: Dig
    note: Defense after attack/freeball (not serve receive)
    outcomes:
      - id: in_system
        label: In system
      - id: out_of_system
        label: Out of system
      - id: overpass
        label: Overpass
      - id: error
        label: Error

  - id: second_touch
    label: Second touch
    note: Second team contact after reception/dig. In/out of system comes from prior pass; quality from following attack.
    outcomes:
      - id: set
        label: Set
        note: Intentional set to a hitter
      - id: save
        label: Save
        note: Emergency second touch to keep the ball playable

  - id: attack
    label: Attack
    outcomes:
      - id: kill
        label: Kill
      - id: defended
        label: Defended
      - id: blocked
        label: Blocked
      - id: error_own
        label: Error (own fault)
      - id: error_bad_set
        label: Error (bad set)

  - id: dump
    label: Dump
    note: Setter tip / dump
    outcomes:
      - id: point
        label: Point
      - id: defended
        label: Defended
      - id: blocked
        label: Blocked
      - id: error_own
        label: Error (own fault)
      - id: error_bad_set
        label: Error (bad set)

  - id: block
    label: Block
    outcomes:
      - id: kill_block
        label: Kill block
      - id: recycle
        label: Recycle
      - id: block_error
        label: Block error

  - id: freeball_send
    label: Freeball (send)
    note: Receiving a freeball = dig
    outcomes:
      - id: in_play
        label: In play
      - id: error
        label: Error
