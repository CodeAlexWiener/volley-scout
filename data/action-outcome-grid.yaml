# Action → outcome grid for volley-scout (v3, two-step grid)
# Flow-aware own-side scouting. See docs/action-outcome-grid.md and docs/scouting-flow.md
# Step 1 picks the outcome (for dig and block: the action); step 2 picks a detail
# (or, for dig and block, the outcome). The first detail is the Enter default.
# App copy: src/data/grid.ts. Situations and rows: src/flow.ts. Scoring: src/rotation.ts.

version: "3.0"
schema: action_outcome_grid

actions:
  - id: serve
    label: Serve
    outcomes:
      - id: in_play
        label: In play
        details: [in_system, out_of_system, overpass] # their pass
      - id: ace
        label: Ace
        details: [no_touch, touched]
      - id: error
        label: Error

  - id: reception
    label: Reception
    note: Only after an opponent serve
    outcomes: [in_system, out_of_system, overpass, error]

  - id: second_touch
    label: Second touch
    outcomes:
      - id: set
      - id: save
      - id: attack_on_2
        note: Next entry is an attack by the same player
      - id: error
        details: [lift_double, net, failed_save]

  - id: attack
    label: Attack
    note: Dump / tip is an attack (attack_on_2 + kill/tip_dump)
    outcomes:
      - id: kill
        details: [spike, tip_dump, block_out]
      - id: defended
      - id: blocked
        details: [stuffed, covered] # stuffed = point them, covered = play on
      - id: error
        details: [out, net, bad_set, violation]

  - id: dig
    label: Dig
    note: First touch after their attack, freeball or overpass
    outcomes: [in_system, out_of_system, overpass, error]

  - id: block
    label: Block
    outcomes:
      - kill_block # point us
      - soft_block # stays on our side, play on
      - touch # play on
      - tooled # off our block and out, point them
      - block_error # net / over the line, point them

  - id: freeball_send
    label: Freeball
    note: Available in second touch, attack and defense situations
    outcomes: [in_play, error]

  - id: opponent_error
    label: Opponent
    note: Opponent row. serve_error only when they serve, out only when the ball comes over.
    outcomes: [serve_error, out, error]

  - id: team
    label: Team
    note: Team row in every situation. Replay is always the last option.
    outcomes:
      - down # their kill, nobody touched it: point them
      - fault # rotation, net, four hits, center line: point them
      - replay # no point, same server

# Outside the grid
#   rally_point (us | them): keys P / O, when the deciding touch is not tracked
#   substitution: playerId comes on, outcome = player id going off
